<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0b">
  <title>Lifelog</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <!--
    No external fonts, no CDN, no framework. Every byte this page needs is either
    inline or one of the files the service worker caches, so it opens instantly and
    works with no signal. See SPEC.md for why the screen is this short.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --surface2: #1c1c20;
      --border: rgba(255, 255, 255, 0.08);
      --border2: rgba(255, 255, 255, 0.16);
      --text: #e8e8ea;
      --muted: #6b6b77;
      --needed: #5fd0a0;
      --wanted: #e8a33d;
      --drifted: #7f8794;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 20px 18px calc(18px + env(safe-area-inset-bottom));
      max-width: 560px;
      margin: 0 auto;
    }

    .hide { display: none !important; }

    /* Capture is a flex column so .spacer can push the send button to the bottom.
       .hide uses !important so it still wins over this. #setup's own rule is below. */
    #capture { display: flex; flex-direction: column; flex: 1 1 auto; }

    /* ---------- header ---------- */

    header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

    #hour {
      font-family: var(--mono);
      font-size: 15px;
      letter-spacing: 0.08em;
      color: var(--muted);
      transition: color .15s;
    }
    #hour.locked { color: var(--text); }

    #cfgBtn {
      background: none; border: 0; color: var(--muted);
      font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
      padding: 4px; cursor: pointer;
    }

    #sub {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .06em;
      color: var(--muted);
      min-height: 15px;
      margin-top: 4px;
    }

    /* ---------- buckets ---------- */

    .buckets { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

    .bucket {
      appearance: none;
      display: flex; align-items: center; gap: 14px;
      min-height: 68px;
      padding: 0 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 19px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: border-color .12s, background .12s;
    }

    .bucket .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--c);
      flex: 0 0 auto;
      transition: box-shadow .12s;
    }

    .bucket .why {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .03em;
      color: var(--muted);
      text-align: right;
      max-width: 48%;
      line-height: 1.4;
      transition: color .12s;
    }

    .bucket[aria-pressed="true"] { background: var(--surface2); border-color: var(--c); }
    .bucket[aria-pressed="true"] .dot { box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.06); }
    .bucket[aria-pressed="true"] .why { color: var(--c); }

    #bNeeded  { --c: #5fd0a0; }
    #bWanted  { --c: #e8a33d; }
    #bDrifted { --c: #7f8794; }

    /* ---------- sentence ---------- */

    #sentence {
      width: 100%;
      min-height: 100px;
      resize: none;
      margin-top: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 16px;      /* below 16px and the browser zooms on focus */
      line-height: 1.5;
    }
    #sentence::placeholder { color: var(--muted); }
    #sentence:focus { outline: none; border-color: var(--border2); }

    /* ---------- day start tick ---------- */

    #dayStartRow {
      display: flex; align-items: center; gap: 12px;
      margin-top: 10px;
      padding: 13px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      user-select: none;
      transition: border-color .12s;
    }

    #dayStartRow .box {
      width: 20px; height: 20px; flex: 0 0 auto;
      border: 1.5px solid var(--border2);
      border-radius: 6px;
      display: grid; place-items: center;
      font-size: 12px; color: var(--bg);
    }

    #dayStartRow[aria-checked="true"] { border-color: var(--needed); }
    #dayStartRow[aria-checked="true"] .box { background: var(--needed); border-color: var(--needed); }
    #dayStartRow[aria-checked="true"] .box::after { content: "\2713"; font-weight: 700; }
    #dayStartRow .label { font-size: 14.5px; }
    #dayStartRow .note {
      font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
      color: var(--muted); margin-left: auto;
    }

    /* ---------- send ---------- */

    .spacer { flex: 1 1 auto; min-height: 16px; }

    #status {
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: .06em;
      text-align: center;
      min-height: 16px;
      margin-bottom: 10px;
      color: var(--muted);
    }
    #status.ok     { color: var(--needed); }
    #status.queued { color: var(--wanted); }

    #send {
      appearance: none;
      width: 100%;
      min-height: 60px;
      border: 0;
      border-radius: 14px;
      background: var(--text);
      color: var(--bg);
      font-family: var(--sans);
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .12s;
    }
    #send:disabled { opacity: .22; cursor: default; }

    /* ---------- setup ---------- */

    #setup { display: flex; flex-direction: column; gap: 14px; }
    #setup h1 { font-size: 17px; font-weight: 600; }
    #setup p { font-size: 13.5px; color: var(--muted); line-height: 1.55; }
    #setup input {
      width: 100%; padding: 13px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text);
      font-family: var(--mono); font-size: 13px;
    }
    #setup input:focus { outline: none; border-color: var(--border2); }
    #setup label {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
      color: var(--muted); display: block; margin-bottom: 6px;
    }
    #setupMsg { font-family: var(--mono); font-size: 11.5px; color: var(--wanted); min-height: 16px; }
    #setupSave {
      min-height: 52px; border: 0; border-radius: 12px;
      background: var(--text); color: var(--bg); font-size: 16px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- ================= first run ================= -->
  <section id="setup" class="hide">
    <h1>Connect the sheet</h1>
    <p>Paste the Apps Script Web App URL and the token. Both stay on this device
      &mdash; nothing is committed to the repo.</p>
    <div>
      <label for="fUrl">WEB APP URL</label>
      <input id="fUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off"
        spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div>
      <label for="fToken">TOKEN</label>
      <input id="fToken" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="value of LIFELOG_TOKEN">
    </div>
    <div id="setupMsg"></div>
    <button id="setupSave" type="button">Verify &amp; save</button>
  </section>

  <!-- ================= capture ================= -->
  <section id="capture" class="hide">
    <header>
      <div id="hour">&mdash;</div>
      <button id="cfgBtn" type="button">CFG</button>
    </header>
    <div id="sub"></div>

    <div class="buckets">
      <button class="bucket" id="bNeeded" type="button" aria-pressed="false" data-bucket="Needed">
        <span class="dot"></span><span>Needed</span>
        <span class="why">the hour had to happen</span>
      </button>
      <button class="bucket" id="bWanted" type="button" aria-pressed="false" data-bucket="Wanted">
        <span class="dot"></span><span>Wanted</span>
        <span class="why">chosen, and worth choosing</span>
      </button>
      <button class="bucket" id="bDrifted" type="button" aria-pressed="false" data-bucket="Drifted">
        <span class="dot"></span><span>Drifted</span>
        <span class="why">attention went somewhere I didn't send it</span>
      </button>
    </div>

    <textarea id="sentence" rows="3" placeholder="what was this hour about?"
      autocapitalize="sentences" spellcheck="true"></textarea>

    <div id="dayStartRow" role="checkbox" tabindex="0" aria-checked="false">
      <span class="box"></span>
      <span class="label">First entry of the day</span>
      <span class="note">STARTS A NEW DAY</span>
    </div>

    <div class="spacer"></div>
    <div id="status"></div>
    <button id="send" type="button" disabled>Log the hour</button>
  </section>

  <script>
    'use strict';

    var LS = { url: 'lifelog.url', token: 'lifelog.token', queue: 'lifelog.queue', last: 'lifelog.last' };
    var BUCKET_IDS = ['bNeeded', 'bWanted', 'bDrifted'];
    var DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    var MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

    var state = { bucket: null, ts: null, dayStart: false, sending: false };
    var flushing = false;
    var clockTimer = null;

    function el(id) { return document.getElementById(id); }
    function pad(n) { return (n < 10 ? '0' : '') + n; }

    /* ---------------- time ---------------- */

    /** ISO 8601 carrying the device's real offset: 2026-08-23T14:03:11+05:30 */
    function isoWithOffset(d) {
      var off = -d.getTimezoneOffset();          // minutes east of UTC
      var sign = off >= 0 ? '+' : '-';
      var abs = Math.abs(off);
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
        'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) +
        sign + pad(Math.floor(abs / 60)) + ':' + pad(abs % 60);
    }

    function shortHour(d) {
      var h = d.getHours() % 12;
      if (h === 0) h = 12;
      return h + ' ' + (d.getHours() < 12 ? 'AM' : 'PM');
    }

    function hourLabel(d) {
      return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + '  ·  ' + shortHour(d);
    }

    /**
     * The timestamp is the moment I sat down to log, not the moment I pressed send.
     * An entry begun at 2:58 and sent at 3:01 belongs to the two o'clock hour.
     * Fires on the first bucket tap or first keystroke, then never again this entry.
     */
    function touchTs() {
      if (state.ts) return;
      state.ts = isoWithOffset(new Date());
      if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
      el('hour').classList.add('locked');
      renderHour();
      setSub();
    }

    function renderHour() {
      el('hour').textContent = hourLabel(state.ts ? new Date(state.ts) : new Date());
    }

    /* ---------------- storage ---------------- */

    function getQueue() {
      try {
        var q = JSON.parse(localStorage.getItem(LS.queue) || '[]');
        return Array.isArray(q) ? q : [];
      } catch (e) { return []; }
    }
    function setQueue(q) { localStorage.setItem(LS.queue, JSON.stringify(q)); }
    function newId() { return Date.now() + '-' + Math.random().toString(36).slice(2, 8); }

    /* ---------------- network ---------------- */

    /**
     * text/plain is a safelisted content type, so this stays a simple request with no
     * preflight - Apps Script handles OPTIONS badly. Never mode:'no-cors': that makes
     * the response opaque, which is exactly how v1 showed a green tick over lost writes.
     */
    function post(payload) {
      var url = localStorage.getItem(LS.url);
      if (!url) return Promise.resolve({ ok: false, error: 'not configured' });
      return fetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(function (res) { return res.text(); })
        .then(function (text) {
          try { return JSON.parse(text); }
          catch (e) { return { ok: false, error: 'unreadable response' }; }
        });
    }

    function health(url, token) {
      var sep = url.indexOf('?') === -1 ? '?' : '&';
      return fetch(url + sep + 'action=health&token=' + encodeURIComponent(token))
        .then(function (r) { return r.text(); })
        .then(function (t) {
          try { return JSON.parse(t); }
          catch (e) { return { ok: false, error: 'unreadable response' }; }
        });
    }

    /**
     * Drain oldest first; stop at the first failure and keep the rest. A payload the
     * server permanently rejects blocks the head of the queue, which surfaces as a depth
     * that never falls with the reason printed beside it. Visibly stuck beats silently
     * dropped - the whole point is that nothing disappears quietly.
     */
    function flushQueue() {
      if (flushing || !localStorage.getItem(LS.url)) return Promise.resolve();
      if (!getQueue().length) return Promise.resolve();
      flushing = true;

      function step() {
        var pending = getQueue();
        if (!pending.length) return Promise.resolve();
        return post(pending[0])
          .catch(function () { return { ok: false, error: 'no connection' }; })
          .then(function (res) {
            if (!res || !res.ok) { renderQueue(res && res.error); return; }
            pending.shift();
            setQueue(pending);
            renderQueue();
            return step();
          });
      }

      return step().then(function () { flushing = false; }, function () { flushing = false; });
    }

    /* ---------------- render ---------------- */

    function setSub(text, warn) {
      var s = el('sub');
      s.textContent = text || defaultSub();
      s.style.color = warn ? 'var(--wanted)' : 'var(--muted)';
    }

    function defaultSub() {
      var last = localStorage.getItem(LS.last);
      if (!last) return '';
      var d = new Date(last);
      if (isNaN(d.getTime())) return '';
      var ref = state.ts ? new Date(state.ts) : new Date();
      var sameHour = d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth() &&
        d.getDate() === ref.getDate() && d.getHours() === ref.getHours();
      return sameHour ? 'already logged this hour' : 'last logged  ' + shortHour(d);
    }

    function renderQueue(reason) {
      var n = getQueue().length;
      if (!n) { setSub(); return; }
      setSub('queued ' + n + (reason ? ' · ' + reason : '') + ' · will retry', true);
    }

    function setStatus(cls, text) {
      el('status').className = cls || '';
      el('status').textContent = text || '';
    }

    function refreshSend() {
      el('send').disabled = !state.bucket || !el('sentence').value.trim() || state.sending;
    }

    function startClock() {
      renderHour();
      setSub();
      if (clockTimer) clearInterval(clockTimer);
      clockTimer = setInterval(function () {
        if (!state.ts) { renderHour(); setSub(); }
      }, 20000);
    }

    function resetForm() {
      state.bucket = null;
      state.ts = null;
      state.dayStart = false;
      el('sentence').value = '';
      el('dayStartRow').setAttribute('aria-checked', 'false');
      BUCKET_IDS.forEach(function (id) { el(id).setAttribute('aria-pressed', 'false'); });
      el('hour').classList.remove('locked');
      startClock();
      refreshSend();
    }

    /* ---------------- actions ---------------- */

    function pickBucket(name) {
      touchTs();
      state.bucket = name;
      BUCKET_IDS.forEach(function (id) {
        el(id).setAttribute('aria-pressed', String(el(id).dataset.bucket === name));
      });
      refreshSend();
      el('sentence').focus();     // one gesture: choose the bucket, keyboard opens
    }

    function send() {
      if (state.sending) return;
      var sentence = el('sentence').value.trim();
      if (!state.bucket || !sentence) return;

      state.sending = true;
      refreshSend();
      setStatus('', 'sending…');

      var payload = {
        token: localStorage.getItem(LS.token) || '',
        id: newId(),
        ts: state.ts || isoWithOffset(new Date()),
        bucket: state.bucket,
        sentence: sentence,
        dayStart: state.dayStart
      };
      var loggedTs = payload.ts;

      post(payload)
        .catch(function () { return { ok: false, error: 'no connection' }; })
        .then(function (res) {
          state.sending = false;
          localStorage.setItem(LS.last, loggedTs);

          if (res && res.ok) {
            resetForm();
            setStatus('ok', res.dedup ? 'already recorded' : 'logged');
            flushQueue();
          } else {
            // The entry is never dropped - it goes to the queue, and the UI says so.
            // The one thing that must never happen is a success state over a failed write.
            var q = getQueue();
            q.push(payload);
            setQueue(q);
            resetForm();
            setStatus('queued', 'queued · ' + ((res && res.error) || 'no connection'));
            renderQueue(res && res.error);
          }
        });
    }

    /* ---------------- setup ---------------- */

    function showSetup() {
      el('setup').classList.remove('hide');
      el('capture').classList.add('hide');
      el('fUrl').value = localStorage.getItem(LS.url) || '';
      el('fToken').value = localStorage.getItem(LS.token) || '';
      el('setupMsg').textContent = '';
    }

    function showCapture() {
      el('setup').classList.add('hide');
      el('capture').classList.remove('hide');
      resetForm();
      renderQueue();
      flushQueue();
    }

    function saveSetup() {
      var url = el('fUrl').value.trim();
      var token = el('fToken').value.trim();
      if (!url || !token) { el('setupMsg').textContent = 'both fields are required'; return; }

      el('setupMsg').textContent = 'checking…';
      // Verified before it is saved. A typo'd URL would otherwise queue every entry
      // forever while the app looked like it was working.
      health(url, token)
        .catch(function () { return { ok: false, error: 'could not reach that URL' }; })
        .then(function (res) {
          if (!res || !res.ok) {
            el('setupMsg').textContent = (res && res.error) || 'rejected';
            return;
          }
          localStorage.setItem(LS.url, url);
          localStorage.setItem(LS.token, token);
          showCapture();
          setStatus('ok', 'connected · ' + res.rows + ' rows · ' + res.tz);
        });
    }

    /* ---------------- wiring ---------------- */

    BUCKET_IDS.forEach(function (id) {
      el(id).addEventListener('click', function () { pickBucket(this.dataset.bucket); });
    });

    el('sentence').addEventListener('input', function () { touchTs(); refreshSend(); });

    function toggleDayStart() {
      touchTs();
      state.dayStart = !state.dayStart;
      el('dayStartRow').setAttribute('aria-checked', String(state.dayStart));
    }
    el('dayStartRow').addEventListener('click', toggleDayStart);
    el('dayStartRow').addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleDayStart(); }
    });

    el('send').addEventListener('click', send);
    el('cfgBtn').addEventListener('click', showSetup);
    el('setupSave').addEventListener('click', saveSetup);
    window.addEventListener('online', function () { flushQueue(); });

    if (localStorage.getItem(LS.url) && localStorage.getItem(LS.token)) showCapture();
    else showSetup();

    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* offline shell is optional */ });
    }
  </script>
</body>

</html>
