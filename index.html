<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0b" id="themeColor">
  <title>Lifelog</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <!--
    No external fonts, no CDN, no framework. Every byte is inline or cached by the
    service worker, so this opens instantly and works with no signal. See SPEC.md.

    Type carries the personality with no webfont: everything the CLOCK touches is mono
    (hours, the rail, the status line, timestamps) and everything YOU write is sans.
    Machine time vs human voice, encoded in the typography instead of decorated on.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --surface: #141416;
      --surface2: #1c1c20;
      --border: rgba(255, 255, 255, 0.08);
      --border2: rgba(255, 255, 255, 0.16);
      --text: #e8e8ea;
      --muted: #6b6b77;
      --needed: #5fd0a0;
      --wanted: #e8a33d;
      --drifted: #7f8794;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
      /* GYST motion tokens */
      --ease-settle:   cubic-bezier(.16,1,.3,1);
      --ease-exit:     cubic-bezier(.5,0,.75,0);
      --ease-standard: cubic-bezier(.25,1,.5,1);
      --dur-fast: 180ms;
      --dur-med:  320ms;
      --dur-slow: 450ms;
    }

    /* Light theme is a ledger card, not an inversion: cool paper and ink, with the three
       buckets darkened to hold their contrast on near-white. Drifted stays grey in both
       themes — that rule is philosophy, not palette. */
    [data-theme="light"] {
      --bg: #f6f7f5;
      --surface: #ffffff;
      --surface2: #eef0ec;
      --border: rgba(0, 0, 0, 0.10);
      --border2: rgba(0, 0, 0, 0.24);
      --text: #17181a;
      --muted: #6a7078;
      --needed: #0f7a52;
      --wanted: #a4650a;
      --drifted: #5d646e;
    }
    /* icon-192.png has a dark background — invert it on the light theme */
    [data-theme="light"] .iconbtn img { filter: invert(1); }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
      max-width: 560px;
      margin: 0 auto;
    }

    .hide { display: none !important; }

    #capture { display: flex; flex-direction: column; flex: 1 1 auto; }

    /* ---------- header ---------- */

    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 12px;
    }
    .brand {
      font-family: var(--mono); font-size: 15px; font-weight: 700;
      letter-spacing: .08em; color: var(--text);
    }
    .headerActions { display: flex; gap: 4px; }

    .iconbtn {
      appearance: none; flex: 0 0 auto;
      width: 40px; height: 40px;
      background: none; border: 1px solid transparent;
      border-radius: 11px; color: var(--muted);
      display: grid; place-items: center;
      cursor: pointer; transition: color var(--dur-fast) var(--ease-standard),
        border-color var(--dur-fast) var(--ease-standard);
    }
    .iconbtn:hover { color: var(--text); }
    .iconbtn img { width: 32px; height: 32px; border-radius: 8px; }
    .iconbtn svg { width: 20px; height: 20px; }

    /* ---------- stepper ---------- */

    .stepper {
      display: flex; align-items: center; gap: 8px;
      justify-content: center; margin-bottom: 10px;
    }

    .step {
      appearance: none; flex: 0 0 auto;
      width: 44px; height: 44px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text);
      font-family: var(--mono); font-size: 16px; line-height: 1;
      cursor: pointer; transition: border-color var(--dur-fast) var(--ease-standard),
        opacity var(--dur-fast) var(--ease-standard);
    }
    .step:disabled { opacity: .25; cursor: default; }

    #block {
      text-align: center; padding: 4px 12px;
      font-family: var(--mono); font-weight: 600;
      font-size: 18px; letter-spacing: .04em;
      color: var(--text);
    }
    #blockDate {
      display: block;
      font-size: 10px; font-weight: 500; letter-spacing: .16em;
      color: var(--muted); margin-bottom: 2px;
    }
    #block.adjusted #blockDate::after { content: " · EDITED"; color: var(--wanted); }

    #sub {
      font-family: var(--mono);
      font-size: 11px; letter-spacing: .06em;
      color: var(--muted); min-height: 15px; text-align: center; margin-bottom: 6px;
    }
    #sub.warn { color: var(--wanted); }

    /* ---------- buckets ---------- */

    .buckets { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }

    .bucket {
      appearance: none;
      display: flex; align-items: center; gap: 14px;
      min-height: 66px; padding: 0 18px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; color: var(--text);
      font-family: var(--sans); font-size: 19px; font-weight: 500;
      text-align: left; cursor: pointer;
      transition: border-color .12s, background .12s;
    }
    .bucket .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--c); flex: 0 0 auto; transition: box-shadow .12s;
    }
    .bucket .why {
      margin-left: auto; font-family: var(--mono);
      font-size: 10.5px; letter-spacing: .03em; color: var(--muted);
      text-align: right; max-width: 48%; line-height: 1.4; transition: color .12s;
    }
    .bucket[aria-pressed="true"] { background: var(--surface2); border-color: var(--c); }
    .bucket[aria-pressed="true"] .dot { box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 22%, transparent); }
    .bucket[aria-pressed="true"] .why { color: var(--c); }

    #bNeeded  { --c: var(--needed); }
    #bWanted  { --c: var(--wanted); }
    #bDrifted { --c: var(--drifted); }

    /* ---------- sentence ---------- */

    #sentence {
      width: 100%; min-height: 96px; resize: none;
      margin-top: 12px; padding: 14px 16px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; color: var(--text);
      font-family: var(--sans); font-size: 16px; line-height: 1.5;
    }
    #sentence::placeholder { color: var(--muted); }
    #sentence:focus { outline: none; border-color: var(--border2); }

    /* ---------- day start ---------- */

    #dayStartRow {
      display: flex; align-items: center; gap: 12px;
      margin-top: 10px; padding: 13px 16px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; cursor: pointer; user-select: none;
      transition: border-color .12s;
    }
    #dayStartRow .box {
      width: 20px; height: 20px; flex: 0 0 auto;
      border: 1.5px solid var(--border2); border-radius: 6px;
      display: grid; place-items: center; font-size: 12px; color: var(--bg);
    }
    #dayStartRow[aria-checked="true"] { border-color: var(--needed); }
    #dayStartRow[aria-checked="true"] .box { background: var(--needed); border-color: var(--needed); }
    #dayStartRow[aria-checked="true"] .box::after { content: "\2713"; font-weight: 700; }
    #dayStartRow .label { font-size: 14.5px; }
    #dayStartRow .note {
      font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
      color: var(--muted); margin-left: auto;
    }

    /* ---------- send ---------- */

    .spacer { flex: 1 1 auto; min-height: 16px; }

    #toast {
      position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
      bottom: calc(20px + env(safe-area-inset-bottom));
      padding: 10px 22px; border-radius: 10px; z-index: 30;
      font-family: var(--mono); font-size: 12px; letter-spacing: .04em;
      color: var(--bg); background: var(--muted);
      pointer-events: none; opacity: 0;
      transition: opacity var(--dur-fast) var(--ease-exit),
        transform var(--dur-fast) var(--ease-exit);
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
      transition: opacity var(--dur-fast) var(--ease-settle),
        transform var(--dur-fast) var(--ease-settle);
    }
    #toast.toast-ok   { background: var(--needed); }
    #toast.toast-warn { background: var(--wanted); }
    #toast.toast-err  { background: #e05252; }

    #send {
      appearance: none; width: 100%; min-height: 60px;
      border: 0; border-radius: 14px;
      background: var(--text); color: var(--bg);
      font-family: var(--sans); font-size: 17px; font-weight: 600;
      cursor: pointer; transition: opacity var(--dur-fast) var(--ease-standard);
    }
    #send:disabled { opacity: .22; cursor: default; }

    /* ---------- setup ---------- */

    #setup { display: flex; flex-direction: column; gap: 14px; }
    #setup h1 { font-size: 17px; font-weight: 600; }
    #setup p { font-size: 13.5px; color: var(--muted); line-height: 1.55; }
    #setup input {
      width: 100%; padding: 13px 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text);
      font-family: var(--mono); font-size: 13px;
    }
    #setup input:focus { outline: none; border-color: var(--border2); }
    #setup label {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
      color: var(--muted); display: block; margin-bottom: 6px;
    }
    #setupMsg { font-family: var(--mono); font-size: 11.5px; color: var(--wanted); min-height: 16px; }
    #setupSave {
      min-height: 52px; border: 0; border-radius: 12px;
      background: var(--text); color: var(--bg); font-size: 16px; font-weight: 600; cursor: pointer;
    }

    #scrim {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
      opacity: 0; pointer-events: none;
      transition: opacity var(--dur-med) var(--ease-standard); z-index: 10;
    }
    #scrim.open { opacity: 1; pointer-events: auto; }

    /* day/week drawer — LEFT side */
    #drawer {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 11;
      width: min(400px, 88vw);
      background: var(--bg); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      transform: translateX(-100%);
      transition: transform var(--dur-med) var(--ease-settle);
      padding: calc(16px + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom);
    }
    #drawer.open { transform: translateX(0); }
    #drawer.closing { transition: transform var(--dur-med) var(--ease-exit); }

    /* hamburger menu — RIGHT side */
    #menu {
      position: fixed; top: 0; bottom: 0; right: 0; z-index: 11;
      width: min(300px, 80vw);
      background: var(--bg); border-left: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 0;
      transform: translateX(100%);
      transition: transform var(--dur-med) var(--ease-settle);
      padding: calc(20px + env(safe-area-inset-top)) 18px env(safe-area-inset-bottom);
    }
    #menu.open { transform: translateX(0); }
    #menu.closing { transition: transform var(--dur-med) var(--ease-exit); }

    .menuHead {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .menuHead h2 {
      font-family: var(--mono); font-size: 12px; font-weight: 600;
      letter-spacing: .12em; color: var(--muted);
    }
    .menuHead .close {
      appearance: none; background: none; border: 0; color: var(--muted);
      font-family: var(--mono); font-size: 18px; cursor: pointer; padding: 0 4px;
    }
    .menuItem {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 0; border-top: 1px solid var(--border);
      cursor: pointer; user-select: none;
    }
    .menuItem:first-of-type { border-top: 0; }
    .menuItem .mi-icon {
      width: 20px; height: 20px; flex: 0 0 20px;
      color: var(--muted); display: grid; place-items: center;
    }
    .menuItem .mi-label {
      flex: 1 1 auto; font-size: 14.5px; color: var(--text);
    }
    .menuItem .mi-detail {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em;
      color: var(--muted);
    }
    .menuItem.danger .mi-label { color: #e05252; }
    .menuItem.danger .mi-icon { color: #e05252; }

    .drawerHead {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 10px; padding: 0 18px 12px;
    }
    .drawerHead h2 {
      font-family: var(--mono); font-size: 12px; font-weight: 600;
      letter-spacing: .12em; color: var(--muted);
    }
    .drawerHead .close {
      appearance: none; background: none; border: 0; color: var(--muted);
      font-family: var(--mono); font-size: 18px; cursor: pointer; padding: 0 4px;
    }

    .rail { flex: 1 1 auto; overflow-y: auto; padding: 0 12px 12px; }
    .railMsg {
      font-family: var(--mono); font-size: 11.5px; letter-spacing: .05em;
      color: var(--muted); text-align: center; padding: 30px 20px; line-height: 1.6;
    }

    /* one row per hour of the logical day. filled = an entry exists, in the bucket's
       colour; empty = a hairline, no ink, tap to log that block. absence is texture,
       never a scold — see SPEC.md on why unaccounted hours are not counted. */
    .hourRow {
      display: flex; align-items: stretch; gap: 10px;
      padding: 3px 6px; border-radius: 10px; cursor: pointer;
    }
    .hourRow:hover { background: var(--surface); }
    .hourRow .time {
      flex: 0 0 58px; padding-top: 9px;
      font-family: var(--mono); font-size: 11px; letter-spacing: .02em;
      color: var(--muted); text-align: right;
    }
    .hourRow .body {
      flex: 1 1 auto; min-width: 0; border-left: 2px solid var(--border);
      padding: 7px 0 7px 12px;
    }
    .hourRow.filled .body { border-left-color: var(--c); }
    .hourRow .line1 { display: flex; align-items: center; gap: 8px; }
    .hourRow .tag {
      font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
      color: var(--c); text-transform: uppercase;
    }
    .hourRow .flag { font-family: var(--mono); font-size: 9px; color: var(--muted); }
    .hourRow .text { font-size: 14px; line-height: 1.45; color: var(--text); margin-top: 2px; word-wrap: break-word; }
    .hourRow.empty .body { border-left-style: dashed; }
    .hourRow.empty .text { color: var(--muted); font-style: italic; font-size: 13px; }

    /* inline editor, revealed under a tapped entry */
    .editor { padding: 8px 6px 12px 76px; }
    .editor.hide { display: none; }
    .editBuckets { display: flex; gap: 6px; margin-bottom: 8px; }
    .editBuckets .eb {
      appearance: none; flex: 1 1 0; min-height: 34px; border-radius: 9px;
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      font-family: var(--mono); font-size: 10px; letter-spacing: .06em; cursor: pointer;
    }
    .editBuckets .eb[aria-pressed="true"] { color: var(--ec); border-color: var(--ec); background: var(--surface2); }
    .eb.n { --ec: var(--needed); } .eb.w { --ec: var(--wanted); } .eb.d { --ec: var(--drifted); }
    .editor textarea {
      width: 100%; min-height: 62px; resize: none; padding: 10px 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.45;
    }
    .editor textarea:focus { outline: none; border-color: var(--border2); }
    .editRow { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .editRow .dayTick {
      font-family: var(--mono); font-size: 10px; letter-spacing: .05em;
      color: var(--muted); cursor: pointer; user-select: none;
    }
    .editRow .dayTick[aria-checked="true"] { color: var(--needed); }
    .editRow .grow { flex: 1 1 auto; }
    .editRow button {
      appearance: none; min-height: 34px; padding: 0 14px; border-radius: 9px;
      font-family: var(--mono); font-size: 11px; letter-spacing: .04em; cursor: pointer; border: 1px solid var(--border);
    }
    .editRow .del { background: none; color: var(--drifted); border-color: transparent; }
    .editRow .save { background: var(--text); color: var(--bg); border: 0; font-weight: 600; }
    .editRow .save:disabled { opacity: .3; }

    /* --- drawer tabs --- */
    .tabs { display: flex; gap: 4px; }
    .tab {
      appearance: none; background: none; border: 0; padding: 4px 10px 8px;
      font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .12em;
      color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }

    /* --- week view: one card per logical day, newest first --- */
    .dayCard { padding: 10px 6px; border-top: 1px solid var(--border); }
    .dayCard:first-child { border-top: 0; }
    .dayHead {
      display: flex; align-items: baseline; gap: 8px; cursor: pointer;
    }
    .dayHead .dow { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: .04em; }
    .dayHead .dt { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
    .dayHead .grow { flex: 1 1 auto; }
    .dayHead .cnt { font-family: var(--mono); font-size: 10px; color: var(--muted); }
    .dayHead .chev { font-family: var(--mono); font-size: 10px; color: var(--muted); transition: transform .15s ease; }
    .dayCard.open .dayHead .chev { transform: rotate(90deg); }
    .balbar {
      display: flex; height: 8px; border-radius: 5px; overflow: hidden;
      margin: 8px 0 2px; background: var(--surface2);
    }
    .balbar span { display: block; height: 100%; }
    .balbar .n { background: var(--needed); } .balbar .w { background: var(--wanted); } .balbar .d { background: var(--drifted); }
    .balLegend { display: flex; gap: 12px; font-family: var(--mono); font-size: 9.5px; color: var(--muted); margin-top: 5px; }
    .balLegend b { font-weight: 600; }
    .balLegend .ln { color: var(--needed); } .balLegend .lw { color: var(--wanted); } .balLegend .ld { color: var(--drifted); }
    .dayEntries { margin-top: 8px; display: none; }
    .dayCard.open .dayEntries { display: block; }
    .weekLine { display: flex; gap: 9px; padding: 3px 2px; align-items: baseline; }
    .weekLine .wt { flex: 0 0 52px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
    .weekLine .dot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; }
    .weekLine .dot.n { background: var(--needed); } .weekLine .dot.w { background: var(--wanted); } .weekLine .dot.d { background: var(--drifted); }
    .weekLine .wtext { flex: 1 1 auto; font-size: 13.5px; line-height: 1.4; color: var(--text); word-wrap: break-word; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>

<body>

  <!-- ================= first run ================= -->
  <section id="setup" class="hide">
    <header>
      <span class="brand">LIFELOG</span>
    </header>
    <h1>Connect the sheet</h1>
    <p>Paste the Apps Script Web App URL and the token. Both stay on this device
      &mdash; nothing is committed to the repo.</p>
    <div>
      <label for="fUrl">WEB APP URL</label>
      <input id="fUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off"
        spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div>
      <label for="fToken">TOKEN</label>
      <input id="fToken" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="value of LIFELOG_TOKEN">
    </div>
    <div id="setupMsg"></div>
    <button id="setupSave" type="button">Verify &amp; save</button>
  </section>

  <!-- ================= capture ================= -->
  <section id="capture" class="hide">
    <header>
      <span class="brand">LIFELOG</span>
      <div class="headerActions">
        <button class="iconbtn" id="railBtn" type="button" aria-label="today's log">
          <img src="./icon-192.png" alt="">
        </button>
        <button class="iconbtn" id="menuBtn" type="button" aria-label="menu">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="stepper">
      <button class="step" id="stepBack" type="button" aria-label="earlier hour">&#9664;</button>
      <div id="block"><span id="blockDate">&mdash;</span><span id="blockRange">&mdash;</span></div>
      <button class="step" id="stepFwd" type="button" aria-label="later hour">&#9654;</button>
    </div>
    <div id="sub"></div>

    <div class="buckets">
      <button class="bucket" id="bNeeded" type="button" aria-pressed="false" data-bucket="Needed">
        <span class="dot"></span><span>Needed</span>
        <span class="why">the hour had to happen</span>
      </button>
      <button class="bucket" id="bWanted" type="button" aria-pressed="false" data-bucket="Wanted">
        <span class="dot"></span><span>Wanted</span>
        <span class="why">chosen, and worth choosing</span>
      </button>
      <button class="bucket" id="bDrifted" type="button" aria-pressed="false" data-bucket="Drifted">
        <span class="dot"></span><span>Drifted</span>
        <span class="why">attention went somewhere I didn't send it</span>
      </button>
    </div>

    <textarea id="sentence" rows="3" placeholder="what was this hour about?"
      autocapitalize="sentences" spellcheck="true"></textarea>

    <div id="dayStartRow" role="checkbox" tabindex="0" aria-checked="false">
      <span class="box"></span>
      <span class="label">First entry of the day</span>
      <span class="note">STARTS A NEW DAY</span>
    </div>

    <div class="spacer"></div>
    <button id="send" type="button" disabled>Log the hour</button>
  </section>

  <!-- ================= toast ================= -->
  <div id="toast"></div>

  <!-- ================= day/week drawer (LEFT) ================= -->
  <div id="scrim"></div>
  <aside id="drawer" aria-hidden="true">
    <div class="drawerHead">
      <div class="tabs" role="tablist">
        <button class="tab" id="tabToday" role="tab" type="button" aria-selected="true">TODAY</button>
        <button class="tab" id="tabWeek" role="tab" type="button" aria-selected="false">WEEK</button>
      </div>
      <button class="close" id="drawerClose" type="button" aria-label="close">&times;</button>
    </div>
    <div class="rail" id="rail"></div>
    <div class="rail" id="week" hidden></div>
  </aside>

  <!-- ================= hamburger menu (RIGHT) ================= -->
  <aside id="menu" aria-hidden="true">
    <div class="menuHead">
      <h2>MENU</h2>
      <button class="close" id="menuClose" type="button" aria-label="close">&times;</button>
    </div>
    <div class="menuItem" id="menuTheme">
      <span class="mi-icon" id="menuThemeIcon">&#9788;</span>
      <span class="mi-label" id="menuThemeLabel">Dark mode</span>
    </div>
    <div class="menuItem" id="menuSync">
      <span class="mi-icon">&#8635;</span>
      <span class="mi-label">Sync now</span>
      <span class="mi-detail" id="syncDetail">checking…</span>
    </div>
    <div class="menuItem danger" id="menuReset">
      <span class="mi-icon">&#9888;</span>
      <span class="mi-label">Reset configuration</span>
    </div>
  </aside>

  <script>
    'use strict';

    var LS = {
      url: 'lifelog.url', token: 'lifelog.token',
      queue: 'lifelog.queue', last: 'lifelog.last', theme: 'lifelog.theme',
      lastSync: 'lifelog.lastSync'
    };
    var BUCKET_IDS = ['bNeeded', 'bWanted', 'bDrifted'];
    var DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    var MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    var HOUR = 3600000;
    var BACK_LIMIT_HOURS = 18;   // how far the stepper walks back; the server guards too

    // slotDate: a Date pinned to the top of the block being accounted for.
    // ts: logged_at, the moment of composing, captured at first interaction.
    // touched: once true, the block stops auto-advancing with the clock.
    var state = { bucket: null, slotDate: null, ts: null, dayStart: false, touched: false, sending: false };
    var clockTimer = null;

    function el(id) { return document.getElementById(id); }
    function pad(n) { return (n < 10 ? '0' : '') + n; }

    /* ---------------- time ---------------- */

    /** ISO 8601 carrying the device's real offset: 2026-08-23T14:03:11+05:30 */
    function isoWithOffset(d) {
      var off = -d.getTimezoneOffset();
      var sign = off >= 0 ? '+' : '-';
      var abs = Math.abs(off);
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
        'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) +
        sign + pad(Math.floor(abs / 60)) + ':' + pad(abs % 60);
    }

    function floorHour(d) { var x = new Date(d.getTime()); x.setMinutes(0, 0, 0); return x; }
    function h12(d) { var h = d.getHours() % 12; return h === 0 ? 12 : h; }
    function mer(d) { return d.getHours() < 12 ? 'AM' : 'PM'; }

    /** The block that most recently CLOSED. At 17:49 that is 16:00–17:00. */
    function lastClosedBlock() { return new Date(floorHour(new Date()).getTime() - HOUR); }

    /** "4 – 5 PM", collapsing a shared meridian; "11 AM – 12 PM" when it isn't shared. */
    function rangeLabel(start) {
      var end = new Date(start.getTime() + HOUR);
      var left = mer(start) === mer(end) ? String(h12(start)) : h12(start) + ' ' + mer(start);
      return left + ' – ' + h12(end) + ' ' + mer(end);
    }
    function dateLabel(d) { return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }

    /* ---------------- storage (IndexedDB — offline-first) ---------------- */

    function newId() { return Date.now() + '-' + Math.random().toString(36).slice(2, 8); }

    /**
     * Minimal IndexedDB wrapper. The 'entries' store is the local source of truth.
     * Each entry mirrors the server shape (slot, bucket, sentence, dayStart, id)
     * plus two internal fields:
     *   _synced        false = needs to be pushed to server
     *   _pendingAction 'log' | 'update' | 'delete' — what to POST next
     *
     * Reads always hit IndexedDB first; the server refreshes in background.
     */
    var DB_NAME = 'lifelog';
    var DB_VERSION = 1;
    var STORE = 'entries';
    var _db = null;

    function openDB() {
      if (_db) return Promise.resolve(_db);
      return new Promise(function (resolve, reject) {
        var req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = function (e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains(STORE)) {
            var s = db.createObjectStore(STORE, { keyPath: 'id' });
            s.createIndex('by-slot', 'slot', { unique: false });
            s.createIndex('by-synced', '_synced', { unique: false });
          }
        };
        req.onsuccess = function (e) { _db = e.target.result; resolve(_db); };
        req.onerror = function () { reject(req.error); };
      });
    }

    function dbPut(entry) {
      return openDB().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(STORE, 'readwrite');
          tx.objectStore(STORE).put(entry);
          tx.oncomplete = function () { resolve(); };
          tx.onerror = function () { reject(tx.error); };
        });
      });
    }

    function dbGet(id) {
      return openDB().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(STORE, 'readonly');
          var req = tx.objectStore(STORE).get(id);
          req.onsuccess = function () { resolve(req.result || null); };
          req.onerror = function () { reject(req.error); };
        });
      });
    }

    function dbDelete(id) {
      return openDB().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(STORE, 'readwrite');
          tx.objectStore(STORE).delete(id);
          tx.oncomplete = function () { resolve(); };
          tx.onerror = function () { reject(tx.error); };
        });
      });
    }

    function dbAll() {
      return openDB().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(STORE, 'readonly');
          var req = tx.objectStore(STORE).getAll();
          req.onsuccess = function () { resolve(req.result || []); };
          req.onerror = function () { reject(req.error); };
        });
      });
    }

    function dbUnsynced() {
      return dbAll().then(function (all) {
        return all.filter(function (e) { return !e._synced; });
      });
    }

    /** Count entries pending sync */
    function dbUnsyncedCount() {
      return dbAll().then(function (all) {
        return all.filter(function (e) { return !e._synced; }).length;
      });
    }

    /**
     * Merge server entries into IndexedDB without overwriting local unsynced edits.
     * Server data is the initial seed and background refresh — local unsynced
     * entries always win.
     */
    function dbMergeServerEntries(entries) {
      return openDB().then(function (db) {
        return new Promise(function (resolve, reject) {
          var tx = db.transaction(STORE, 'readwrite');
          var store = tx.objectStore(STORE);
          var remaining = entries.length;
          if (!remaining) { resolve(); return; }
          entries.forEach(function (e) {
            var check = store.get(e.id);
            check.onsuccess = function () {
              var existing = check.result;
              // don't overwrite local unsynced changes
              if (!existing || existing._synced !== false) {
                store.put({
                  id: e.id, slot: e.slot, bucket: e.bucket,
                  sentence: e.sentence, dayStart: !!e.dayStart,
                  _synced: true, _pendingAction: null
                });
              }
              remaining--;
              if (remaining === 0) resolve();
            };
            check.onerror = function () { remaining--; if (remaining === 0) resolve(); };
          });
          tx.onerror = function () { reject(tx.error); };
        });
      });
    }

    /* ------------ sync engine ------------ */

    var syncing = false;

    /**
     * Push unsynced entries to the server, oldest first. Stops at first failure
     * to preserve ordering (same semantics as the old flushQueue).
     */
    function syncQueue() {
      if (syncing || !localStorage.getItem(LS.url)) return Promise.resolve();
      syncing = true;
      function step() {
        return dbUnsynced().then(function (pending) {
          if (!pending.length) return;
          // sort oldest first
          pending.sort(function (a, b) { return (a.id < b.id ? -1 : 1); });
          var entry = pending[0];
          var action = entry._pendingAction || 'log';

          var payload = {
            token: localStorage.getItem(LS.token) || '',
            action: action,
            id: entry.id
          };
          if (action === 'log' || action === 'update') {
            payload.slot = entry.slot;
            payload.bucket = entry.bucket;
            payload.sentence = entry.sentence;
            payload.dayStart = entry.dayStart;
            if (action === 'log') payload.ts = entry._ts || isoWithOffset(new Date());
          }

          return post(payload)
            .catch(function () { return { ok: false, error: 'no connection' }; })
            .then(function (res) {
              if (!res || !res.ok) {
                // self-heal: server says 'not found' on update → entry never synced, retry as log
                if (action === 'update' && res && /not found/i.test(res.error)) {
                  entry._pendingAction = 'log';
                  entry._ts = entry._ts || isoWithOffset(new Date());
                  return dbPut(entry).then(function () { return step(); });
                }
                renderSyncStatus(res && res.error); return;
              }
              if (action === 'delete') {
                return dbDelete(entry.id).then(function () { renderSyncStatus(); return step(); });
              }
              entry._synced = true;
              entry._pendingAction = null;
              return dbPut(entry).then(function () { renderSyncStatus(); return step(); });
            });
        });
      }
      return step().then(
        function () {
          syncing = false;
          // record last successful sync if queue is now empty
          dbUnsyncedCount().then(function (n) {
            if (!n) localStorage.setItem(LS.lastSync, new Date().toISOString());
          });
        },
        function () { syncing = false; }
      );
    }

    /** Migrate any leftover localStorage queue entries into IndexedDB (one-time). */
    function migrateOldQueue() {
      var raw;
      try { raw = JSON.parse(localStorage.getItem(LS.queue) || '[]'); } catch (e) { raw = []; }
      if (!Array.isArray(raw) || !raw.length) return Promise.resolve();
      var chain = Promise.resolve();
      raw.forEach(function (payload) {
        chain = chain.then(function () {
          return dbPut({
            id: payload.id,
            slot: payload.slot,
            bucket: payload.bucket,
            sentence: payload.sentence,
            dayStart: !!payload.dayStart,
            _synced: false,
            _pendingAction: payload.action || 'log',
            _ts: payload.ts
          });
        });
      });
      return chain.then(function () { localStorage.removeItem(LS.queue); });
    }

    /** Seed IndexedDB from server on first load (when DB is empty). */
    function seedFromServer() {
      return dbAll().then(function (all) {
        if (all.length) return; // already populated
        return apiGet('action=week&days=14')
          .catch(function () { return { ok: false }; })
          .then(function (res) {
            if (!res || !res.ok || !Array.isArray(res.entries)) return;
            return dbMergeServerEntries(res.entries);
          });
      });
    }

    /* ---------------- theme ---------------- */

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      // update menu label if the menu element exists (it does after first render)
      var lbl = el('menuThemeLabel'), ico = el('menuThemeIcon');
      if (lbl) lbl.textContent = t === 'light' ? 'Light mode' : 'Dark mode';
      if (ico) ico.innerHTML = t === 'light' ? '&#9789;' : '&#9788;';
      // keep the OS status bar / PWA chrome in step with the surface
      var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      el('themeColor').setAttribute('content', bg || '#0a0a0b');
    }
    function initTheme() {
      var saved = localStorage.getItem(LS.theme);
      if (saved !== 'light' && saved !== 'dark') {
        saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
          ? 'light' : 'dark';
      }
      applyTheme(saved);
    }
    function toggleTheme() {
      var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      localStorage.setItem(LS.theme, next);
      applyTheme(next);
    }

    /* ---------------- network (unchanged, verified) ---------------- */

    /**
     * text/plain is safelisted, so this is a simple request with no preflight — Apps
     * Script handles OPTIONS badly. Never mode:'no-cors': that makes the response opaque,
     * which is exactly how v1 showed a green tick over lost writes.
     */
    function post(payload) {
      var url = localStorage.getItem(LS.url);
      if (!url) return Promise.resolve({ ok: false, error: 'not configured' });
      return fetch(url, {
        method: 'POST', mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(function (res) { return res.text(); })
        .then(function (text) {
          try { return JSON.parse(text); } catch (e) { return { ok: false, error: 'unreadable response' }; }
        });
    }

    function apiGet(params) {
      var url = localStorage.getItem(LS.url);
      var token = localStorage.getItem(LS.token) || '';
      if (!url) return Promise.resolve({ ok: false, error: 'not configured' });
      var sep = url.indexOf('?') === -1 ? '?' : '&';
      return fetch(url + sep + params + '&token=' + encodeURIComponent(token))
        .then(function (r) { return r.text(); })
        .then(function (t) { try { return JSON.parse(t); } catch (e) { return { ok: false, error: 'unreadable response' }; } });
    }


    /* ---------------- render ---------------- */

    function renderBlock() {
      if (!state.slotDate) state.slotDate = lastClosedBlock();
      el('blockDate').textContent = dateLabel(state.slotDate);
      el('blockRange').textContent = rangeLabel(state.slotDate);
      el('block').classList.toggle('adjusted', state.touched);
      // bounds: can't go past the in-progress block, can't walk back past the limit
      var maxMs = floorHour(new Date()).getTime();
      var minMs = maxMs - BACK_LIMIT_HOURS * HOUR;
      el('stepFwd').disabled = state.slotDate.getTime() >= maxMs;
      el('stepBack').disabled = state.slotDate.getTime() <= minMs;
    }

    function setSub(text, warn) {
      var s = el('sub');
      s.textContent = text || defaultSub();
      s.classList.toggle('warn', !!warn);
    }

    function defaultSub() {
      var last = localStorage.getItem(LS.last);
      if (!last) return '';
      var d = new Date(last);
      if (isNaN(d.getTime())) return '';
      return 'last logged  ' + h12(d) + ' ' + mer(d);
    }

    function renderSyncStatus(reason) {
      dbUnsyncedCount().then(function (n) {
        if (!n) { setSub(); return; }
        var msg = 'syncing ' + n + (reason ? ' · ' + reason : '') + ' · will retry';
        setSub(msg, true);
        showToast(msg, 'warn');
      }).catch(function () { setSub(); });
    }

    var toastTimer = null;
    function showToast(text, type) {
      var t = el('toast');
      clearTimeout(toastTimer);
      t.textContent = text;
      t.className = 'show' + (type ? ' toast-' + type : '');
      toastTimer = setTimeout(function () {
        t.classList.remove('show');
      }, 2500);
    }

    function refreshSend() {
      el('send').disabled = !state.bucket || !el('sentence').value.trim() || state.sending;
    }

    function startClock() {
      renderBlock(); setSub();
      if (clockTimer) clearInterval(clockTimer);
      clockTimer = setInterval(function () {
        // only advance the default block while the user hasn't chosen one
        if (!state.touched) { state.slotDate = lastClosedBlock(); renderBlock(); setSub(); }
      }, 30000);
    }

    function resetForm() {
      state.bucket = null; state.ts = null; state.dayStart = false; state.touched = false;
      state.slotDate = lastClosedBlock();
      el('sentence').value = '';
      el('dayStartRow').setAttribute('aria-checked', 'false');
      BUCKET_IDS.forEach(function (id) { el(id).setAttribute('aria-pressed', 'false'); });
      startClock();
      refreshSend();
    }

    /* ---------------- actions ---------------- */

    /** logged_at is locked at the first interaction, so it means "when I composed this". */
    function touchTs() { if (!state.ts) state.ts = isoWithOffset(new Date()); }

    function stepBlock(delta) {
      touchTs();
      state.touched = true;                       // manual choice; stop auto-advancing
      var maxMs = floorHour(new Date()).getTime();
      var minMs = maxMs - BACK_LIMIT_HOURS * HOUR;
      var next = state.slotDate.getTime() + delta * HOUR;
      state.slotDate = new Date(Math.max(minMs, Math.min(maxMs, next)));
      renderBlock();
    }

    function pickBucket(name) {
      touchTs();
      state.bucket = name;
      BUCKET_IDS.forEach(function (id) { el(id).setAttribute('aria-pressed', String(el(id).dataset.bucket === name)); });
      refreshSend();
      el('sentence').focus();
    }

    function toggleDayStart() {
      touchTs();
      state.dayStart = !state.dayStart;
      el('dayStartRow').setAttribute('aria-checked', String(state.dayStart));
    }

    function send() {
      if (state.sending) return;
      var sentence = el('sentence').value.trim();
      if (!state.bucket || !sentence) return;

      state.sending = true; refreshSend();

      var slot = isoWithOffset(state.slotDate || lastClosedBlock());
      var ts = state.ts || isoWithOffset(new Date());

      // check if an entry already exists at this slot — update it instead of duplicating
      dbAll().then(function (all) {
        var existing = null;
        for (var i = 0; i < all.length; i++) {
          if (all[i].slot === slot && all[i]._pendingAction !== 'delete') {
            existing = all[i]; break;
          }
        }

        var entry;
        if (existing) {
          entry = {
            id: existing.id, slot: slot, bucket: state.bucket,
            sentence: sentence, dayStart: state.dayStart,
            _synced: false,
            _pendingAction: existing._synced ? 'update' : (existing._pendingAction || 'log'),
            _ts: existing._ts || ts
          };
        } else {
          entry = {
            id: newId(), slot: slot, bucket: state.bucket,
            sentence: sentence, dayStart: state.dayStart,
            _synced: false, _pendingAction: 'log', _ts: ts
          };
        }

        return dbPut(entry).then(function () {
          state.sending = false;
          localStorage.setItem(LS.last, ts);
          resetForm();
          showToast(existing ? 'updated' : 'logged', 'ok');
          syncQueue();
        });
      }).catch(function () {
        state.sending = false;
        showToast('local save failed', 'err');
      });
    }

    /* ---------------- setup ---------------- */

    function showSetup() {
      el('setup').classList.remove('hide');
      el('capture').classList.add('hide');
      el('fUrl').value = localStorage.getItem(LS.url) || '';
      el('fToken').value = localStorage.getItem(LS.token) || '';
      el('setupMsg').textContent = '';
    }

    function showCapture() {
      el('setup').classList.add('hide');
      el('capture').classList.remove('hide');
      resetForm();
      migrateOldQueue()
        .then(function () { return seedFromServer(); })
        .then(function () { renderSyncStatus(); syncQueue(); });
    }

    function saveSetup() {
      var url = el('fUrl').value.trim();
      var token = el('fToken').value.trim();
      if (!url || !token) { el('setupMsg').textContent = 'both fields are required'; return; }
      el('setupMsg').textContent = 'checking…';
      // Verified before saving. A typo'd URL would otherwise queue every entry forever
      // while the app looked like it was working.
      var sep = url.indexOf('?') === -1 ? '?' : '&';
      fetch(url + sep + 'action=health&token=' + encodeURIComponent(token))
        .then(function (r) { return r.text(); })
        .then(function (t) { try { return JSON.parse(t); } catch (e) { return { ok: false, error: 'unreadable response' }; } })
        .catch(function () { return { ok: false, error: 'could not reach that URL' }; })
        .then(function (res) {
          if (!res || !res.ok) { el('setupMsg').textContent = (res && res.error) || 'rejected'; return; }
          localStorage.setItem(LS.url, url);
          localStorage.setItem(LS.token, token);
          showCapture();
          showToast('connected · ' + res.rows + ' rows · ' + res.tz, 'ok');
        });
    }

    /* ---------------- today drawer ---------------- */

    var CLS = { Needed: 'n', Wanted: 'w', Drifted: 'd' };
    var drawer = { view: 'today', entries: [], openEditId: null, openDays: {} };

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function openDrawer() {
      el('scrim').classList.add('open');
      el('drawer').classList.remove('closing');
      el('drawer').classList.add('open');
      el('drawer').setAttribute('aria-hidden', 'false');
      setView(drawer.view);
    }
    function closeDrawer() {
      el('drawer').classList.add('closing');
      el('drawer').classList.remove('open');
      el('drawer').setAttribute('aria-hidden', 'true');
      el('scrim').classList.remove('open');
      drawer.openEditId = null;
    }

    function setView(v) {
      drawer.view = v;
      el('tabToday').setAttribute('aria-selected', String(v === 'today'));
      el('tabWeek').setAttribute('aria-selected', String(v === 'week'));
      el('rail').hidden = v !== 'today';
      el('week').hidden = v !== 'week';
      if (v === 'today') loadToday(); else loadWeek();
    }

    /**
     * Local-first: read from IndexedDB → render instantly → refresh from server in background.
     * Replicates the server's currentDaySlice_ on the client: find the last day_start tick
     * in slot-sorted entries, or fall back to an 18h window.
     */
    function todaySlice(all) {
      // exclude entries pending delete
      var live = all.filter(function (e) { return e._pendingAction !== 'delete'; });
      var sorted = live.slice().sort(function (a, b) { return (a.slot < b.slot ? -1 : a.slot > b.slot ? 1 : 0); });
      for (var i = sorted.length - 1; i >= 0; i--) {
        if (sorted[i].dayStart) return sorted.slice(i);
      }
      var cutoff = Date.now() - BACK_LIMIT_HOURS * HOUR;
      return sorted.filter(function (e) { return Date.parse(e.slot) >= cutoff; });
    }

    function loadToday() {
      // instant render from IndexedDB
      dbAll().then(function (all) {
        drawer.entries = todaySlice(all);
        renderRail();
      }).catch(function () {
        el('rail').innerHTML = '<div class="railMsg">local read failed</div>';
      });

      // background refresh from server (stale-while-revalidate for data)
      apiGet('action=today')
        .catch(function () { return { ok: false }; })
        .then(function (res) {
          if (!res || !res.ok || !Array.isArray(res.entries)) return;
          dbMergeServerEntries(res.entries).then(function () {
            return dbAll();
          }).then(function (all) {
            drawer.entries = todaySlice(all);
            renderRail();
          });
        });
    }

    /**
     * One row per hour from the day's first block to the block in progress. A block with
     * an entry is drawn filled in its bucket colour; an empty block is a dashed hairline
     * that logs that hour when tapped. Unaccounted hours are shown as absence of ink, not
     * as a count of failures — see SPEC.md.
     */
    function renderRail() {
      var rail = el('rail');
      var entries = drawer.entries.slice().sort(function (a, b) {
        return Date.parse(a.slot) - Date.parse(b.slot);
      });

      var group = {};
      entries.forEach(function (e) { (group[e.slot] = group[e.slot] || []).push(e); });

      var firstMs = entries.length ? floorHour(new Date(entries[0].slot)).getTime()
        : lastClosedBlock().getTime();
      var lastMs = floorHour(new Date()).getTime();
      if (firstMs > lastMs) firstMs = lastMs;
      if ((lastMs - firstMs) / HOUR > 30) firstMs = lastMs - 30 * HOUR; // guard runaway

      var html = '';
      for (var ms = firstMs; ms <= lastMs; ms += HOUR) {
        var d = new Date(ms);
        var key = isoWithOffset(d);
        var t = h12(d) + ' ' + mer(d);
        var rows = group[key];
        if (rows && rows.length) {
          rows.forEach(function (e) { html += filledRow(e, t); });
        } else {
          html += '<div class="hourRow empty" data-slot="' + key + '">' +
            '<div class="time">' + t + '</div>' +
            '<div class="body"><div class="text">log this hour</div></div></div>';
        }
      }
      rail.innerHTML = html || '<div class="railMsg">no entries yet today</div>';

      // wire empty rows -> open capture at that block
      Array.prototype.forEach.call(rail.querySelectorAll('.hourRow.empty'), function (row) {
        row.addEventListener('click', function () { captureAt(row.dataset.slot); });
      });
      // wire filled rows -> toggle inline editor
      Array.prototype.forEach.call(rail.querySelectorAll('.hourRow.filled'), function (row) {
        row.addEventListener('click', function () { toggleEditor(row.dataset.id); });
      });
      if (drawer.openEditId) mountEditor(drawer.openEditId);
    }

    function filledRow(e, t) {
      var c = CLS[e.bucket] || 'd';
      var flag = e.dayStart ? '<span class="flag">&#9670; day start</span>' : '';
      return '<div class="hourRow filled ' + c + '" data-id="' + esc(e.id) + '" style="--c:var(--' +
        (c === 'n' ? 'needed' : c === 'w' ? 'wanted' : 'drifted') + ')">' +
        '<div class="time">' + t + '</div>' +
        '<div class="body"><div class="line1"><span class="tag">' + esc(e.bucket) + '</span>' + flag +
        '</div><div class="text">' + esc(e.sentence) + '</div></div></div>';
    }

    function captureAt(slotIso) {
      var d = new Date(slotIso);
      if (isNaN(d.getTime())) return;
      closeDrawer();
      state.slotDate = floorHour(d);
      state.touched = true;
      touchTs();
      renderBlock();
      el('sentence').focus();
    }

    function toggleEditor(id) {
      drawer.openEditId = (drawer.openEditId === id) ? null : id;
      renderRail();
    }

    /** Build the inline editor beneath the open row. Bucket AND sentence are editable
        (your call — mistaps are real); day_start is editable too, which is the two-tap
        fix for a missed or misplaced tick. logged_at is never shown or touched. */
    function mountEditor(id) {
      var e = null;
      for (var i = 0; i < drawer.entries.length; i++) if (drawer.entries[i].id === id) e = drawer.entries[i];
      if (!e) return;
      var row = el('rail').querySelector('.hourRow.filled[data-id="' + cssEsc(id) + '"]');
      if (!row) return;

      var box = document.createElement('div');
      box.className = 'editor';
      box.innerHTML =
        '<div class="editBuckets">' +
        '<button class="eb n" type="button" data-b="Needed">NEEDED</button>' +
        '<button class="eb w" type="button" data-b="Wanted">WANTED</button>' +
        '<button class="eb d" type="button" data-b="Drifted">DRIFTED</button></div>' +
        '<textarea>' + esc(e.sentence) + '</textarea>' +
        '<div class="editRow">' +
        '<span class="dayTick" role="checkbox" tabindex="0">&#9670; day start</span>' +
        '<span class="grow"></span>' +
        '<button class="del" type="button">delete</button>' +
        '<button class="save" type="button">save</button></div>';
      row.insertAdjacentElement('afterend', box);

      var chosen = e.bucket;
      var day = !!e.dayStart;
      var ta = box.querySelector('textarea');
      var saveBtn = box.querySelector('.save');
      var tick = box.querySelector('.dayTick');

      function paint() {
        Array.prototype.forEach.call(box.querySelectorAll('.eb'), function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.b === chosen));
        });
        tick.setAttribute('aria-checked', String(day));
        saveBtn.disabled = !chosen || !ta.value.trim();
      }
      Array.prototype.forEach.call(box.querySelectorAll('.eb'), function (b) {
        b.addEventListener('click', function () { chosen = b.dataset.b; paint(); });
      });
      ta.addEventListener('input', paint);
      function toggleDay() { day = !day; paint(); }
      tick.addEventListener('click', toggleDay);
      tick.addEventListener('keydown', function (ev) {
        if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); toggleDay(); }
      });
      saveBtn.addEventListener('click', function () {
        saveBtn.disabled = true; saveBtn.textContent = 'saving…';
        dbGet(id).then(function (existing) {
          var updated = {
            id: id, slot: e.slot, bucket: chosen,
            sentence: ta.value.trim(), dayStart: day,
            _synced: false, _pendingAction: 'update',
            _ts: (existing && existing._ts) || null
          };
          return dbPut(updated);
        }).then(function () {
          drawer.openEditId = null;
          showToast('saved', 'ok');
          loadToday();
          syncQueue();
        }).catch(function () {
          saveBtn.disabled = false; saveBtn.textContent = 'save'; saveBtn.classList.add('err');
        });
      });
      box.querySelector('.del').addEventListener('click', function () {
        var delBtn = box.querySelector('.del'); delBtn.textContent = 'deleting…';
        dbGet(id).then(function (existing) {
          if (existing) {
            existing._synced = false;
            existing._pendingAction = 'delete';
            return dbPut(existing);
          }
        }).then(function () {
          drawer.openEditId = null;
          showToast('deleted', 'ok');
          loadToday();
          syncQueue();
        }).catch(function () { delBtn.textContent = 'delete'; });
      });
      paint();
      ta.focus();
    }

    function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }

    /* ---------------- week view (the Sunday review) ---------------- */

    var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

    function loadWeek() {
      var cutoff = Date.now() - 7 * 24 * HOUR;
      function weekEntries(all) {
        return all.filter(function (e) {
          return e._pendingAction !== 'delete' && Date.parse(e.slot) >= cutoff;
        });
      }

      // instant render from IndexedDB
      dbAll().then(function (all) {
        renderWeek(weekEntries(all));
      }).catch(function () {
        el('week').innerHTML = '<div class="railMsg">local read failed</div>';
      });

      // background refresh from server
      apiGet('action=week&days=7')
        .catch(function () { return { ok: false }; })
        .then(function (res) {
          if (!res || !res.ok || !Array.isArray(res.entries)) return;
          dbMergeServerEntries(res.entries).then(function () {
            return dbAll();
          }).then(function (all) {
            renderWeek(weekEntries(all));
          });
        });
    }

    /**
     * A logical day runs from one day_start tick to the next — the same rule the capture
     * screen and the today rail obey. The clock never decides the boundary; the tick does.
     * Entries with no preceding tick form their own leading group so nothing is hidden.
     */
    function segmentDays(entries) {
      var days = [], cur = null;
      entries.forEach(function (e) {
        if (e.dayStart || !cur) { cur = { start: e.slot, entries: [] }; days.push(cur); }
        cur.entries.push(e);
      });
      return days;
    }

    function renderWeek(entries) {
      var sorted = entries.slice().sort(function (a, b) { return Date.parse(a.slot) - Date.parse(b.slot); });
      var days = segmentDays(sorted).reverse(); // newest day first
      if (!days.length) { el('week').innerHTML = '<div class="railMsg">no entries in the last 7 days</div>'; return; }
      if (Object.keys(drawer.openDays).length === 0) drawer.openDays[days[0].start] = true; // newest open

      var html = '';
      days.forEach(function (day) {
        var d = new Date(day.start);
        var c = { Needed: 0, Wanted: 0, Drifted: 0 };
        day.entries.forEach(function (e) { if (c[e.bucket] != null) c[e.bucket]++; });
        var total = day.entries.length || 1;
        var seg = function (k, cls) { return c[k] ? '<span class="' + cls + '" style="width:' + (c[k] / total * 100) + '%"></span>' : ''; };
        var open = drawer.openDays[day.start] ? ' open' : '';

        var lines = day.entries.slice().reverse().map(function (e) {
          var t = h12(new Date(e.slot)) + ' ' + mer(new Date(e.slot));
          var cl = CLS[e.bucket] || 'd';
          return '<div class="weekLine"><span class="wt">' + t + '</span>' +
            '<span class="dot ' + cl + '"></span><span class="wtext">' + esc(e.sentence) + '</span></div>';
        }).join('');

        html += '<div class="dayCard' + open + '" data-day="' + esc(day.start) + '">' +
          '<div class="dayHead"><span class="dow">' + DOW[d.getDay()] + '</span>' +
          '<span class="dt">' + d.getDate() + ' ' + MON[d.getMonth()] + '</span>' +
          '<span class="grow"></span>' +
          '<span class="cnt">' + day.entries.length + ' logged</span>' +
          '<span class="chev">&#9656;</span></div>' +
          '<div class="balbar">' + seg('Needed', 'n') + seg('Wanted', 'w') + seg('Drifted', 'd') + '</div>' +
          '<div class="balLegend"><span class="ln"><b>' + c.Needed + '</b> needed</span>' +
          '<span class="lw"><b>' + c.Wanted + '</b> wanted</span>' +
          '<span class="ld"><b>' + c.Drifted + '</b> drifted</span></div>' +
          '<div class="dayEntries">' + lines + '</div></div>';
      });
      el('week').innerHTML = html;

      Array.prototype.forEach.call(el('week').querySelectorAll('.dayCard'), function (card) {
        card.querySelector('.dayHead').addEventListener('click', function () {
          var k = card.dataset.day;
          drawer.openDays[k] = !drawer.openDays[k];
          card.classList.toggle('open', drawer.openDays[k]);
        });
      });
    }

    /* ---------------- wiring ---------------- */

    initTheme();

    el('stepBack').addEventListener('click', function () { stepBlock(-1); });
    el('stepFwd').addEventListener('click', function () { stepBlock(1); });

    BUCKET_IDS.forEach(function (id) {
      el(id).addEventListener('click', function () { pickBucket(this.dataset.bucket); });
    });
    el('sentence').addEventListener('input', function () { touchTs(); refreshSend(); });
    el('dayStartRow').addEventListener('click', toggleDayStart);
    el('dayStartRow').addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleDayStart(); }
    });
    el('send').addEventListener('click', send);
    el('setupSave').addEventListener('click', saveSetup);

    /* --- left drawer (day/week) --- */
    el('railBtn').addEventListener('click', openDrawer);
    el('drawerClose').addEventListener('click', closeDrawer);
    el('tabToday').addEventListener('click', function () { setView('today'); });
    el('tabWeek').addEventListener('click', function () { setView('week'); });

    /* --- right menu (hamburger) --- */
    function openMenu() {
      el('scrim').classList.add('open');
      el('menu').classList.remove('closing');
      el('menu').classList.add('open');
      el('menu').setAttribute('aria-hidden', 'false');
      // refresh sync detail
      dbUnsyncedCount().then(function (n) {
        var last = localStorage.getItem(LS.lastSync);
        var lastStr = last ? relTime(last) : 'never';
        el('syncDetail').textContent = (n ? n + ' pending · ' : '') + lastStr;
      }).catch(function () {});
    }
    function closeMenu() {
      el('menu').classList.add('closing');
      el('menu').classList.remove('open');
      el('menu').setAttribute('aria-hidden', 'true');
      el('scrim').classList.remove('open');
    }
    function relTime(isoStr) {
      var diff = Math.round((Date.now() - new Date(isoStr).getTime()) / 1000);
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      return Math.floor(diff / 3600) + 'h ago';
    }

    el('menuBtn').addEventListener('click', openMenu);
    el('menuClose').addEventListener('click', closeMenu);

    el('menuTheme').addEventListener('click', function () {
      toggleTheme();
    });

    el('menuSync').addEventListener('click', function () {
      el('syncDetail').textContent = 'syncing…';
      syncQueue().then(function () {
        return dbUnsyncedCount();
      }).then(function (n) {
        var last = localStorage.getItem(LS.lastSync);
        el('syncDetail').textContent = (n ? n + ' pending · ' : '') + (last ? relTime(last) : 'never');
        showToast(n ? 'synced partially · ' + n + ' remaining' : 'fully synced', n ? 'warn' : 'ok');
      }).catch(function () {
        el('syncDetail').textContent = 'sync failed';
        showToast('sync failed', 'err');
      });
    });

    el('menuReset').addEventListener('click', function () {
      if (!confirm('Reset configuration? You will need to re-enter your Apps Script URL and token.')) return;
      [LS.url, LS.token, LS.last, LS.lastSync].forEach(function (k) { localStorage.removeItem(k); });
      closeMenu();
      showSetup();
      showToast('configuration reset', 'warn');
    });

    /* scrim closes whichever panel is open */
    el('scrim').addEventListener('click', function () {
      if (el('drawer').classList.contains('open')) closeDrawer();
      else closeMenu();
    });

    /* Escape closes either */
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (el('drawer').classList.contains('open')) closeDrawer();
      else if (el('menu').classList.contains('open')) closeMenu();
    });

    /* --- swipe gestures --- */
    (function () {
      var sx = 0, sy = 0, tracking = false;
      var MIN_X = 50, MAX_Y = 80;

      document.addEventListener('touchstart', function (e) {
        var t = e.touches[0];
        sx = t.clientX; sy = t.clientY; tracking = true;
      }, { passive: true });

      document.addEventListener('touchend', function (e) {
        if (!tracking) return; tracking = false;
        var t = e.changedTouches[0];
        var dx = t.clientX - sx, dy = t.clientY - sy;
        if (Math.abs(dy) > MAX_Y || Math.abs(dx) < MIN_X) return;

        var drawerOpen = el('drawer').classList.contains('open');
        var menuOpen   = el('menu').classList.contains('open');

        if (!drawerOpen && !menuOpen) {
          // nothing open: swipe right → drawer, swipe left → menu
          if (dx > 0) openDrawer();
          else openMenu();
        } else if (drawerOpen && dx < 0) {
          closeDrawer();
        } else if (menuOpen && dx > 0) {
          closeMenu();
        }
      }, { passive: true });
    }());

    window.addEventListener('online', function () { syncQueue(); });

    if (localStorage.getItem(LS.url) && localStorage.getItem(LS.token)) showCapture();
    else showSetup();

    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* offline shell is optional */ });
    }
  </script>
</body>
